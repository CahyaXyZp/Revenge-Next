name: Build Plugins

# Builds the plugins under plugins/ and publishes them as a Revenge plugin repository on the
# `plugin-dist` branch. The branch is served by raw.githubusercontent.com, so this workflow never
# touches GitHub Pages and cannot affect the Revenge bundle deployed by update-bundle.yml.
#
# The plugin sources live on the `next-plugins` branch. `main` only holds the bundle workflow.
#
# - push to next-plugins:  build and publish
# - pull request:          build only, so a broken plugin is caught before merging

on:
  push:
    branches: [next-plugins]
    paths:
      - "plugins/**"
      - "package.json"
      - "tsconfig.json"
      - "repo.config.json"
      - ".github/scripts/**"
      - ".github/workflows/build-plugins.yml"
  pull_request:
    paths:
      - "plugins/**"
      - "package.json"
      - "tsconfig.json"
      - "repo.config.json"
      - ".github/scripts/**"
      - ".github/workflows/build-plugins.yml"

permissions:
  contents: write

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('plugins-pr-{0}', github.event.number) || 'plugin-dist' }}
  cancel-in-progress: false

env:
  PLUGIN_BRANCH: plugin-dist
  PUBLIC_URL: https://raw.githubusercontent.com/${{ github.repository }}/plugin-dist

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Build plugins
        run: bash .github/scripts/build-plugins.sh build-out "$PUBLIC_URL"

      - name: Check build
        run: |
          set -euo pipefail
          jq -e '.plugins | length > 0' build-out/index.json > /dev/null
          jq -r '.plugins | to_entries[] | "\(.key) \(.value.channels | tostring)"' build-out/index.json
          ls -l build-out/pool

      - name: Upload build for inspection
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: plugin-repository
          path: build-out

      - name: Publish to the plugin-dist branch
        if: github.event_name != 'pull_request'
        env:
          PLUGIN_REMOTE: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: bash .github/scripts/publish-plugin-branch.sh build-out "$PUBLIC_URL"
