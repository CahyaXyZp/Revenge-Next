name: Update Revenge Bundle

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Find latest successful production build
        id: build
        shell: bash
        run: |
          set -euo pipefail

          runs="$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/revenge-mod/revenge-bundle-next/actions/workflows/build.yml/runs?branch=main&status=success&per_page=20")"

          run_id="$(jq -r '
            .workflow_runs
            | map(select(.conclusion == "success"))
            | sort_by(.run_number)
            | last
            | .id
          ' <<< "$runs")"

          if [[ -z "$run_id" || "$run_id" == "null" ]]; then
            echo "No successful production build found."
            exit 1
          fi

          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "Using build run: $run_id"

      - name: Download production artifact
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p site

          artifacts="$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/revenge-mod/revenge-bundle-next/actions/runs/\${{ steps.build.outputs.run_id }}/artifacts?name=revenge-bundle&per_page=100")"

          artifact_url="$(jq -r '.artifacts[] | select(.name == "revenge-bundle" and .expired == false) | .archive_download_url' <<< "$artifacts" | head -n 1)"

          if [[ -z "$artifact_url" || "$artifact_url" == "null" ]]; then
            echo "Production artifact 'revenge-bundle' was not found."
            exit 1
          fi

          curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "$artifact_url" \
            -o /tmp/revenge-bundle.zip

          unzip -j /tmp/revenge-bundle.zip "revenge.bundle" -d site/
          test -s site/revenge.bundle

          cat > site/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="robots" content="noindex">
            <title>Revenge Bundle</title>
          </head>
          <body>
            <a href="revenge.bundle">Download revenge.bundle</a>
          </body>
          </html>
          EOF

          touch site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
