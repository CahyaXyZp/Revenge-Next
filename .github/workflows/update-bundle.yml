name: Update Revenge Bundle

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Download latest production artifact
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p site

          artifacts="$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/revenge-mod/revenge-bundle-next/actions/artifacts?name=revenge-bundle&per_page=100")"

          artifact_url="$(jq -r '
            .artifacts
            | map(select(.name == "revenge-bundle" and .expired == false))
            | sort_by(.created_at)
            | last
            | .archive_download_url
          ' <<< "$artifacts")"

          if [[ -z "$artifact_url" || "$artifact_url" == "null" ]]; then
            echo "Production artifact 'revenge-bundle' was not found."
            exit 1
          fi

          echo "Using latest production artifact: $artifact_url"

          curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            -H "Authorization: Bearer ${{ github.token }}" \
            "$artifact_url" \
            -o /tmp/revenge-bundle.zip

          unzip -j /tmp/revenge-bundle.zip "revenge.bundle" -d site/
          test -s site/revenge.bundle

          cat > site/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="robots" content="noindex">
            <title>Revenge Bundle</title>
          </head>
          <body>
            <a href="revenge.bundle">Download revenge.bundle</a>
          </body>
          </html>
          EOF

          touch site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
